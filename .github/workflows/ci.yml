name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The suite runs without Django and without a database on purpose — that
      # is what keeps this job at ~15s. pydantic is the one exception: the
      # verification crew declares its structured-output schema at module
      # scope, so importing it (for the pure `findings_payload` helper) needs
      # pydantic present. Everything else the tests reach is stdlib-only, and
      # yaml is imported lazily inside the functions that use it.
      - name: Install test tooling
        run: pip install pytest ruff pydantic
      - name: Lint (ruff)
        run: |
          ruff check \
            apps/findings/risk.py apps/findings/attack_map.py \
            apps/hunts/costs.py apps/hunts/assets.py \
            apps/observability/confidence.py \
            redweaver_engine/tools/scope.py tests/
      - name: Unit tests
        run: pytest -q

  version-sync:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read __version__
        id: ver
        run: |
          VER=$(python -c "exec(open('backend/redweaver/__version__.py').read()); print(__version__)")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Sync version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${{ steps.ver.outputs.version }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
